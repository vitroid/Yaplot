<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yaplot WASM debug</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222; color: #eee; font: 12px monospace; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #log { height: 180px; overflow: auto; background: #111; padding: 8px; white-space: pre-wrap; }
    #canvas { flex: 1; width: 100%; background: #000; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="log"></div>
    <canvas id="canvas" tabindex="0"></canvas>
  </div>
  <script>
    var logEl = document.getElementById('log');
    function log() {
      var s = Array.prototype.slice.call(arguments).map(String).join(' ');
      logEl.textContent += s + '\n';
      logEl.scrollTop = logEl.scrollHeight;
      console.log.apply(console, arguments);
    }
    window.onerror = function (m, src, line, col, err) {
      log('ONERROR', m, src + ':' + line, err && err.stack);
    };
    window.addEventListener('unhandledrejection', function (e) {
      log('UNHANDLED', e.reason);
    });
    var Module = {
      arguments: ['/global.yap'],
      canvas: document.getElementById('canvas'),
      print: function (t) { log('OUT', t); },
      printErr: function (t) { log('ERR', t); },
      onRuntimeInitialized: function () {
        log('onRuntimeInitialized', 'canvas', Module.canvas.width, Module.canvas.height, 'yapCtx', !!Module.yapCtx);
      }
    };
    log('loading yaplot.js…');
  </script>
  <script src="yaplot.js"></script>
</body>
</html>
